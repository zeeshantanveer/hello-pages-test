<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello — Welcome</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Hello, world!</h1>
    <p class="lead">A tiny static site created for you.</p>
    <button id="changeBtn">Change message</button>
    <p id="message" aria-live="polite"></p>
    <footer class="foot">Made with LoopHands</footer>
  </main>

  <script>
    const btn = document.getElementById('changeBtn');
    const msg = document.getElementById('message');
    const messages = [
      'Have a great day!',
      'Keep shipping great things 🚀',
      'Hello from your LoopHands assistant!'
    ];
    let i = 0;
    btn.addEventListener('click', ()=>{
      msg.textContent = messages[i++ % messages.length];
    });
    // show default message
    msg.textContent = messages[0];
  </script>
</body>
</html>
